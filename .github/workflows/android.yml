name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x QRScanner/gradlew

      - name: Build APK
        run: cd QRScanner && ./gradlew assembleDebug

      - name: Find APK
        run: find $GITHUB_WORKSPACE -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-APK
          path: ${{ github.workspace }}/QRScanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30
