name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x QRScanner/gradlew

      - name: Build APK
        run: cd QRScanner && ./gradlew assembleDebug

      - name: List all APK files
        run: find / -name "*.apk" 2>/dev/null || true

      - name: Copy APK to workspace
        run: |
          mkdir -p output
          find . -name "app-debug.apk" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRScanner-APK
          path: output/app-debug.apk
          retention-days: 30
